# GoReleaser config for packyard.
# https://goreleaser.com
#
# A v* tag push triggers .github/workflows/release.yml, which runs
# `goreleaser release --clean`. Artifacts: Linux amd64 + arm64 tarballs
# (primary), Darwin amd64 + arm64 tarballs (best-effort), a multi-arch
# Docker image on ghcr.io/schochastics/packyard, checksums, and SBOMs.

version: 2

project_name: packyard

before:
  hooks:
    - go mod tidy

builds:
  - id: packyard-server
    main: ./cmd/packyard-server
    binary: packyard-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/schochastics/packyard/internal/version.Version={{.Version}}

archives:
  - id: default
    formats: [ tar.gz ]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_ {{- title .Os }}_ {{- if eq .Arch
      "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ zip ]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  # No `+` build-metadata suffix: Docker tag grammar forbids it, and we
  # want snapshot builds to exercise the same Docker path as releases.
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"

sboms:
  - artifacts: archive

# One multi-platform buildx build per release: both platforms and every
# tag go out as a single image index. (The deprecated dockers +
# docker_manifests pair pushed per-arch tags and stitched them together
# afterwards; on v1.2.1 an arm64 re-push moved the tag under the
# manifest, and creating :latest failed digest verification.)
dockers_v2:
  - id: packyard
    dockerfile: Dockerfile.release
    images:
      - "ghcr.io/schochastics/packyard"
    tags:
      - "{{ .Version }}"
      # Prerelease tags (v1.3.0-rc.1) must not repoint :latest.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Single-binary R package registry for internal packages."
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/schochastics/packyard"
      org.opencontainers.image.licenses: "MIT"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^feat(\\(.+\\))?!?:"
      order: 0
    - title: Fixes
      regexp: "^fix(\\(.+\\))?!?:"
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^test(\\(.+\\))?!?:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: schochastics
    name: packyard
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## packyard {{ .Tag }}
  footer: |
    ---

    See [implementation.md](https://github.com/schochastics/packyard/blob/main/implementation.md) for what's shipped in each phase.
