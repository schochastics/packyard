# GoReleaser config for packyard.
# https://goreleaser.com
#
# A v* tag push runs .woodpecker/release.yml, which runs
# `goreleaser release --clean` with GITEA_TOKEN set. Artifacts on the
# Gitea release: Linux amd64 + arm64 tarballs (primary), Darwin amd64 +
# arm64 tarballs (best-effort), checksums, and SBOMs. The container
# image is built by a separate buildx step in the same pipeline.

version: 2

project_name: packyard

before:
  hooks:
    - go mod tidy

builds:
  - id: packyard-server
    main: ./cmd/packyard-server
    binary: packyard-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X gitea.cynkra.com/david.schoch/packyard/internal/version.Version={{.Version}}

archives:
  - id: default
    formats: [ tar.gz ]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_ {{- title .Os }}_ {{- if eq .Arch
      "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ zip ]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: "^feat(\\(.+\\))?:"
      order: 0
    - title: Fixes
      regexp: "^fix(\\(.+\\))?:"
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - Merge pull request
      - Merge branch

gitea_urls:
  api: https://gitea.cynkra.com/api/v1
  download: https://gitea.cynkra.com

# Only GITEA_TOKEN is set in CI; don't let a stray GITHUB_TOKEN win.
force_token: gitea

release:
  gitea:
    owner: david.schoch
    name: packyard
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## packyard {{ .Tag }}
  footer: |
    ---

    Image: `gitea.cynkra.com/david.schoch/packyard:{{ .Version }}`
