# CI: vet, race tests, build smoke test, lint and OpenAPI lint on every
# push to main, every pull request, and on demand.
#
# Steps run one after another in the shared workspace, so modules are
# downloaded and the dependency tree (modernc.org/sqlite is large) is
# compiled once: GOCACHE/GOMODCACHE live under /woodpecker/src/.cache,
# on the volume all steps share. Running them as parallel pods would repeat that work in
# each pod and multiply peak memory.
#
# The CPU limit matters: Go sizes GOMAXPROCS from the cgroup CPU limit
# and otherwise from the node's cores, which on a large node means
# dozens of parallel compiles and an OOM kill without any log line.
#
# make e2e needs a Docker daemon, which the Kubernetes runners don't
# have; run it on a Docker host before tagging (tests/e2e/README.md).

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  test:
    image: golang:1.25
    environment: &goenv
      GOCACHE: /woodpecker/src/.cache/go-build
      GOMODCACHE: /woodpecker/src/.cache/mod
      GOLANGCI_LINT_CACHE: /woodpecker/src/.cache/golangci-lint
    commands:
      # The workspace is owned by another uid than the container user;
      # without this git refuses to run ("dubious ownership"), which
      # breaks the tidy check and Go's VCS stamping.
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum || { echo "go.mod/go.sum not tidy; run 'go mod tidy'"; exit 1; }
      - go vet ./...
      - go test -race -count=1 ./...
    backend_options: &resources
      kubernetes:
        resources:
          requests:
            memory: 1500Mi
            cpu: 1000m
          limits:
            memory: 4000Mi
            cpu: 2000m
        nodeSelector:
          CI: "woodpecker"
        tolerations:
          - key: "CI"
            operator: "Exists"
            effect: "NoSchedule"

  build:
    image: golang:1.25
    environment: *goenv
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - make build
      - ./packyard-server -version
    backend_options: *resources

  lint:
    image: golangci/golangci-lint:v2.5.0
    environment: *goenv
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - golangci-lint run ./...
    backend_options: *resources

  openapi-lint:
    image: dshanley/vacuum:v0.30.6
    commands:
      # Errors gate; stylistic warnings are tracked separately.
      - vacuum lint --errors openapi/openapi.yaml
    backend_options: *resources
