# Release: a v* tag push publishes
#   - a Gitea release with Linux/macOS tarballs, checksums and SBOMs
#     (GoReleaser, .goreleaser.yaml), and
#   - the multi-arch image gitea.cynkra.com/<owner>/packyard:X.Y.Z and
#     :latest (tag without the leading v).
#
# Repository secrets (Woodpecker → repo settings → Secrets):
#   gitea_token  Gitea access token of the repository owner with
#                write:repository and write:package scopes. Used for the
#                release API and as the registry password.

when:
  - event: tag
    ref: refs/tags/v*

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      # GoReleaser builds the changelog from the history since the
      # previous tag.
      depth: 0
      tags: true
      lfs: false

steps:
  test:
    image: golang:1.25
    commands:
      - go vet ./...
      - go test -race -count=1 ./...
    backend_options: &resources
      kubernetes:
        resources:
          requests:
            memory: 1000Mi
            cpu: 1000m
          limits:
            memory: 2000Mi
        nodeSelector:
          CI: "woodpecker"
        tolerations:
          - key: "CI"
            operator: "Exists"
            effect: "NoSchedule"

  release:
    image: goreleaser/goreleaser:v2.12.7
    depends_on: [test]
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - goreleaser release --clean
    backend_options: *resources

  image:
    image: woodpeckerci/plugin-docker-buildx:6.0.1
    depends_on: [test]
    settings:
      dockerfile: Dockerfile
      # The Go build stage runs on the build platform and cross-compiles
      # (Dockerfile: --platform=$BUILDPLATFORM, GOARCH=$TARGETARCH), so
      # arm64 needs no emulation.
      platforms: linux/amd64,linux/arm64
      build_args:
        VERSION: ${CI_COMMIT_TAG##v}
      repo: gitea.cynkra.com/${CI_REPO}
      tags:
        - ${CI_COMMIT_TAG##v}
        - latest
      labels:
        - org.opencontainers.image.source=${CI_REPO_URL}
        - org.opencontainers.image.version=${CI_COMMIT_TAG##v}
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}
        - org.opencontainers.image.licenses=MIT
      logins:
        - registry: https://gitea.cynkra.com
          username: ${CI_REPO_OWNER}
          password:
            from_secret: gitea_token
    backend_options: *resources
