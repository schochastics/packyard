# packyard binary matrix — which binaries publishers may upload.
#
# A deployment serves exactly ONE Linux distribution. `distro` is the
# Posit Package Manager codename and appears verbatim in client URLs:
#
#   options(repos = c(INTERNAL = "https://packyard.example.org/prod/__linux__/jammy/latest"))
#
# Cells vary only by R minor version. List every R minor your
# Workbench/Connect images install; clients on an R version without a
# cell fall back to source packages.
#
# distro:  jammy | noble | rhel9 | …   (packyard-server -init -distro …)
# arch:    amd64 | arm64
# r_minor: MAJOR.MINOR (e.g. "4.5"; NOT "4.5.1" — R binaries are pinned
#          at minor-version granularity)

distro: jammy
arch: amd64
default_r_minor: "4.5"

cells:
  - { name: r-4.4, r_minor: "4.4" }
  - { name: r-4.5, r_minor: "4.5" }
  - { name: r-4.6, r_minor: "4.6" }
