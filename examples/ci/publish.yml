# examples/ci/publish.yml — reference GitHub/Gitea Actions workflow for
# publishing an R package to packyard. The work happens in
# packyard-publish.sh; this file only picks the build image and the
# target channels. Requires:
#   - Secret PACKYARD_TOKEN with publish:<channel> on every target.
#   - Variable PACKYARD_SERVER (e.g. https://packages.example.org).
#   - Variable PACKYARD_BUILD_IMAGE: an image with every R version the
#     server has a cell for under /opt/R/<version>/, on the distribution
#     the server serves — typically the same image Workbench runs.
#   - packyard-publish.sh and packyard-ci-lib.sh copied to .ci/.

name: Publish to packyard

on:
  push:
    branches: [main, test, dev]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    container: { image: "${{ vars.PACKYARD_BUILD_IMAGE }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          PACKYARD_SERVER: ${{ vars.PACKYARD_SERVER }}
          PACKYARD_TOKEN:  ${{ secrets.PACKYARD_TOKEN }}
        run: |
          # main lands everywhere; test lands on test and dev; anything
          # else on dev only. Edit to taste.
          case "${GITHUB_REF_NAME}" in
            main) export PACKYARD_CHANNELS="prod test dev" ;;
            test) export PACKYARD_CHANNELS="test dev" ;;
            *)    export PACKYARD_CHANNELS="dev" ;;
          esac
          .ci/packyard-publish.sh
