# Keeps the SHA-pinned actions in .github/workflows/ and the Go module
# dependencies current. Dependabot rewrites both the SHA and the
# trailing "# vX.Y.Z" comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    # x/sync >= 0.21 requires go 1.26; the module pins 1.25.0 (see
    # CLAUDE.md). Drop this when the toolchain moves.
    ignore:
      - dependency-name: golang.org/x/sync
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
