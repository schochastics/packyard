name: Fuzz

# Runs on pull requests that touch the publish parsers, weekly, and on
# demand. Re-fuzzing unchanged code every night rarely finds anything.

on:
  pull_request:
    paths:
      - "internal/api/publish*.go"
      - "internal/api/testdata/fuzz/**"
      # The fuzz targets drive the store, CAS and DESCRIPTION parsing too.
      - "internal/store/**"
      - "internal/cas/**"
      - "internal/rpkg/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Mondays 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzPublishManifest
          - FuzzPublishMultipartBody
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: |
          go test -run '^$' \
            -fuzz '^${{ matrix.target }}$' \
            -fuzztime 2m \
            ./internal/api/

      - name: Upload failure corpus
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: internal/api/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
