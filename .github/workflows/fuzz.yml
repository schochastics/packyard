name: Fuzz

# Runs on pull requests that touch the publish parsers, weekly, and on
# demand. Re-fuzzing unchanged code every night rarely finds anything.

on:
  pull_request:
    paths:
      - "internal/api/publish*.go"
      - "internal/api/testdata/fuzz/**"
      # The fuzz targets drive the store, CAS and DESCRIPTION parsing too.
      - "internal/store/**"
      - "internal/cas/**"
      - "internal/rpkg/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Mondays 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzPublishManifest
          - FuzzPublishMultipartBody
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: |
          go test -run '^$' \
            -fuzz '^${{ matrix.target }}$' \
            -fuzztime 2m \
            ./internal/api/

      - name: Upload failure corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: internal/api/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
