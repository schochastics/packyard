name: CRAN e2e

# End-to-end suite: packyard in a container, publishes through the
# reference CI scripts, then install.packages(), remotes, renv and pak
# from real R 4.4 / 4.5 clients on Ubuntu 22.04 and AlmaLinux 9. The
# scenarios live in tests/e2e/ and run anywhere Docker does
# (`make e2e`); this workflow only calls that target.
#
# The client images are large, so this runs only on pull requests that
# touch the server, the publish/bundle scripts or the suite itself, plus
# weekly to catch drift in R, renv, pak and remotes, and on demand
# (run it before tagging a release). The HTTP-level protocol tests in
# internal/api/cran_protocol_test.go run on every push.

on:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Makefile"
      - "examples/ci/**"
      - "examples/bundler/**"
      - "tests/e2e/**"
      - ".github/workflows/cran-e2e.yml"
  schedule:
    # Mondays 05:37 UTC.
    - cron: "37 5 * * 1"
  workflow_dispatch: {}

concurrency:
  group: cran-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [jammy, rhel9]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make e2e E2E_DISTROS=${{ matrix.distro }}
      - name: Server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.distro }}
          path: tests/e2e/out/
